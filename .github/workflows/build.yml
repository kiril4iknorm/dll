name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Add BepInEx NuGet Feed
        run: dotnet nuget add source https://nuget.bepinex.dev/v3/index.json --name BepInEx

      - name: Build Solution
        run: |
          dotnet build IdealMarketPrice.csproj -c Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IdealMarketPrice-DLL
          path: bin/Release/**/IdealMarketPrice.dll
